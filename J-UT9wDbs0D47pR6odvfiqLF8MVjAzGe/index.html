*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif;background:#EFEFEA;color:#1A1A18;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;min-height:100vh}
button:not(:disabled){cursor:pointer}
:focus-visible{outline:2px solid #378ADD;outline-offset:2px}
.gateWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gateCard{background:#fff;border-radius:16px;padding:32px 36px;max-width:420px;width:100%;text-align:center}
.gateLogo{height:30px;margin-bottom:18px;filter:invert(16%) sepia(30%) saturate(1600%) hue-rotate(196deg)}
.gateTitle{font-size:17px;font-weight:700;color:#1B2E5E;margin-bottom:8px}
.gateText{font-size:13px;color:#6b6b67;line-height:1.6;margin-bottom:18px}
.gateInput{width:100%;padding:11px 14px;border:1px solid #e0dfd8;border-radius:8px;font-size:16px;
  text-align:center;letter-spacing:.3em;font-family:inherit;background:#FAFAF7}
.gateBtn{width:100%;margin-top:12px;padding:11px;background:#1B2E5E;color:#fff;border:none;
  border-radius:8px;font-size:13px;font-weight:600;font-family:inherit}
.gateError{font-size:12px;color:#A32D2D;margin-top:10px}
.pie{text-align:center;font-size:10.5px;color:#b8b7b1;padding:0 0 22px}
</style>

// ── El componente del informe, tal cual vive en la app ──────────────────────

// Informe financiero que RECIBE EL CLIENTE (handoff «InvoxAI Rediseño v2», §16).
//
// Una sola implementación para los dos sitios donde se ve:
//   · pages/informe/[token].js — el enlace que abre el cliente
//   · pages/index.js (vista `informe`) — la previsualización de la asesoría,
//     que además muestra la barra flotante (conBarra) con el conmutador de
//     dispositivo y las acciones de envío.
//
// NO calcula nada: todo sale ya masticado de lib/informe.js
// (`calcularDatosInforme`), que es el mismo motor que alimenta la app, el
// Excel y los ficheros oficiales. Aquí solo se presenta.
//
// Tono de la redacción (del handoff): segunda persona y lenguaje corriente,
// sin jerga fiscal en los titulares; el nº de modelo va como referencia
// secundaria en gris.


const NAVY = '#1B2E5E'
const AMBAR = '#E0A100'
const VERDE = '#00A846'
const ROJO = '#A32D2D'

// Formato explícito: no se confía en toLocaleString para el separador de
// miles (no lo emite en todos los runtimes) — regla del handoff.
const eur = (n) => {
  const num = Number(n || 0)
  const neg = num < 0
  const [ent, dec] = Math.abs(num).toFixed(2).split('.')
  return (neg ? '−' : '') + ent.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + dec + ' €'
}
const eur0 = (n) => {
  const num = Number(n || 0)
  const neg = num < 0
  const ent = Math.abs(num).toFixed(0)
  return (neg ? '−' : '') + ent.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' €'
}
const pct = (n) => `${Math.round(Number(n) || 0)} %`

const MESES_LARGO = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre']
const MESES_CORTO = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic']
const TRIMS = ['1T', '2T', '3T', '4T']
// Día límite de presentación de cada trimestre (mes 0-based)
const LIMITE_TRIM = { '1T': [3, 20], '2T': [6, 20], '3T': [9, 20], '4T': [0, 30] }
// Primer día del trimestre, para medir cuánto se ha consumido del plazo
const INICIO_TRIM = { '1T': [0, 1], '2T': [3, 1], '3T': [6, 1], '4T': [9, 1] }

const trimestreDeHoy = () => {
  const m = new Date().getMonth() + 1
  return m <= 3 ? '1T' : m <= 6 ? '2T' : m <= 9 ? '3T' : '4T'
}

// ── Piezas reutilizables ────────────────────────────────────────────────────
const Card = ({ children, style }) => (
  React.createElement('section', { style: { background: '#fff', borderRadius: 16, ...style },}, children)
)

const Rotulo = ({ children, style }) => (
  React.createElement('div', { style: { fontSize: 10.5, fontWeight: 700, letterSpacing: '.09em', textTransform: 'uppercase', color: '#A8A7A1', ...style },}, children)
)

const Titulo = ({ children, style }) => (
  React.createElement('div', { style: { fontSize: 16, fontWeight: 700, color: NAVY, ...style },}, children)
)

// Tarta con conic-gradient: anillo blanco central con el total dentro
// El total del centro se calcula SIEMPRE desde las porciones dibujadas, para
// que la cifra y el círculo cuenten lo mismo.
const Tarta = ({ partes, tamano = 148 }) => {
  const total = partes.reduce((s, p) => s + p.importe, 0)
  let acumulado = 0
  const tramos = partes.map(p => {
    const desde = acumulado
    acumulado += p.pct
    return `${p.color} ${desde}% ${acumulado}%`
  }).join(', ')
  return (
    React.createElement('div', { style: { position: 'relative', width: tamano, height: tamano, flexShrink: 0 },}
      , React.createElement('div', { style: { width: '100%', height: '100%', borderRadius: '50%', background: partes.length ? `conic-gradient(${tramos})` : '#EEF0F5' },} )
      , React.createElement('div', { style: { position: 'absolute', inset: tamano * 0.26, background: '#fff', borderRadius: '50%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' },}
        , React.createElement('div', { style: { fontSize: 13, fontWeight: 800, color: NAVY, whiteSpace: 'nowrap' },}, eur0(total))
      )
    )
  )
}

const Leyenda = ({ partes }) => (
  React.createElement('div', { style: { flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 7 },}
    , partes.map(p => (
      React.createElement('div', { key: p.label, style: { display: 'flex', alignItems: 'center', gap: 8, fontSize: 12 },}
        , React.createElement('span', { style: { width: 10, height: 10, borderRadius: 3, background: p.color, flexShrink: 0 },} )
        , React.createElement('span', { style: { flex: 1, minWidth: 0, color: '#1a1a18', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' },}, p.label)
        , React.createElement('span', { style: { color: '#8a8983', flexShrink: 0 },}, pct(p.pct))
        , React.createElement('span', { style: { fontWeight: 700, color: NAVY, flexShrink: 0, whiteSpace: 'nowrap' },}, eur0(p.importe))
      )
    ))
  )
)

// Barras dobles mes a mes
const BarrasMensuales = ({ meses, colorA, colorB, etiquetaA, etiquetaB, conImportes = false, alto = 120 }) => {
  const max = Math.max(1, ...meses.map(m => Math.max(m.a, m.b)))
  return (
    React.createElement('div', null

  var PIN_ITER = 100000;
  var PLAIN_DATA = null;
  var ANO_INICIAL = 2026;
  var EXPIRA = null;
  var raiz = null;

  // Envoltorio con el estado del ejercicio: el informe publicado puede llevar
  // varios años congelados y el cliente cambia entre ellos con las flechas.
  function Publicado(props) {
    var anos = Object.keys(props.data).map(Number).sort(function(a,b){return a-b});
    var inicial = props.data[ANO_INICIAL] ? ANO_INICIAL : anos[anos.length-1];
    var par = React.useState(inicial);
    var ano = par[0], setAno = par[1];
    var datos = props.data[ano] || props.data[inicial];
    return React.createElement(window.__InformeCliente, {
      datos: datos,
      onAno: anos.length > 1 ? setAno : null,
      anosDisponibles: anos,
    });
  }

  function pintar(DATA) {
    var nodo = document.getElementById('informeRoot');
    nodo.style.display = '';
    document.getElementById('pieGenerado').style.display = '';
    raiz = ReactDOM.createRoot(nodo);
    raiz.render(React.createElement(Publicado, { data: DATA }));
  }

  // ── Comprobación de caducidad ──────────────────────────────────────────
  if (EXPIRA) {
    var fin = new Date(EXPIRA + 'T23:59:59');
    if (new Date() > fin) {
      document.getElementById('expiredCard').style.display = '';
      return;
    }
  }

  // ── Sin PIN: mostrar directamente ──────────────────────────────────────
  if (!PIN_PROTECTED) { pintar(PLAIN_DATA); return; }

  // ── Con PIN: pedir código y descifrar con Web Crypto ───────────────────
  function b64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function descifrar(pin) {
    var salt = b64ToBytes(PIN_SALT_B64);
    var iv = b64ToBytes(PIN_IV_B64);
    var datos = b64ToBytes(PIN_DATA_B64);
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pin), { name: 'PBKDF2' }, false, ['deriveKey'])
      .then(function(keyMaterial){
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: PIN_ITER, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function(key){
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, datos);
      })
      .then(function(plainBuf){
        return JSON.parse(new TextDecoder().decode(plainBuf));
      });
  }

  var gateCard = document.getElementById('gateCard');
  var gateError = document.getElementById('gateError');
  gateCard.style.display = '';

  document.getElementById('gateForm').addEventListener('submit', function(e){
    e.preventDefault();
    gateError.style.display = 'none';
    descifrar(document.getElementById('pinInput').value).then(function(data){
      gateCard.style.display = 'none';
      pintar(data);
    }).catch(function(){
      gateError.style.display = '';
    });
  });
})();
