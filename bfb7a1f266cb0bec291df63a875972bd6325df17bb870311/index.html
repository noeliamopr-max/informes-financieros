.gateText{font-size:13px;color:#64748B;line-height:1.6;margin-bottom:18px}
.gateInput{width:100%;padding:11px 14px;border:1px solid #E2E8F0;border-radius:6px;font-size:16px;
  text-align:center;letter-spacing:.3em;font-family:inherit;background:#F1F5F9}
.gateBtn{width:100%;margin-top:12px;padding:11px;background:#183868;color:#fff;border:none;
  border-radius:6px;font-size:13px;font-weight:600;font-family:inherit}
.gateError{font-size:12px;color:#DC2626;margin-top:10px}
.pie{text-align:center;font-size:12px;color:#94A3B8;padding:0 0 22px}
</style>

  var PIN_ITER = 100000;
  var PLAIN_DATA = null;
  var ANO_INICIAL = 2026;
  var EXPIRA = "2026-10-31";
  var raiz = null;

  // Envoltorio con el estado del ejercicio: el informe publicado puede llevar
  // varios años congelados y el cliente cambia entre ellos con las flechas.
  function Publicado(props) {
    var anos = Object.keys(props.data).map(Number).sort(function(a,b){return a-b});
    var inicial = props.data[ANO_INICIAL] ? ANO_INICIAL : anos[anos.length-1];
    var par = React.useState(inicial);
    var ano = par[0], setAno = par[1];
    var datos = props.data[ano] || props.data[inicial];
    return React.createElement(window.__InformeCliente, {
      datos: datos,
      onAno: anos.length > 1 ? setAno : null,
      anosDisponibles: anos,
    });
  }

  function pintar(DATA) {
    var nodo = document.getElementById('informeRoot');
    nodo.style.display = '';
    document.getElementById('pieGenerado').style.display = '';
    raiz = ReactDOM.createRoot(nodo);
    raiz.render(React.createElement(Publicado, { data: DATA }));
  }

  // ── Comprobación de caducidad ──────────────────────────────────────────
  if (EXPIRA) {
    var fin = new Date(EXPIRA + 'T23:59:59');
    if (new Date() > fin) {
      document.getElementById('expiredCard').style.display = '';
      return;
    }
  }

  // ── Sin PIN: mostrar directamente ──────────────────────────────────────
  if (!PIN_PROTECTED) { pintar(PLAIN_DATA); return; }

  // ── Con PIN: pedir código y descifrar con Web Crypto ───────────────────
  function b64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function descifrar(pin) {
    var salt = b64ToBytes(PIN_SALT_B64);
    var iv = b64ToBytes(PIN_IV_B64);
    var datos = b64ToBytes(PIN_DATA_B64);
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pin), { name: 'PBKDF2' }, false, ['deriveKey'])
      .then(function(keyMaterial){
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: PIN_ITER, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function(key){
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, datos);
      })
      .then(function(plainBuf){
        return JSON.parse(new TextDecoder().decode(plainBuf));
      });
  }

  var gateCard = document.getElementById('gateCard');
  var gateError = document.getElementById('gateError');
  gateCard.style.display = '';

  document.getElementById('gateForm').addEventListener('submit', function(e){
    e.preventDefault();
    gateError.style.display = 'none';
    descifrar(document.getElementById('pinInput').value).then(function(data){
      gateCard.style.display = 'none';
      pintar(data);
    }).catch(function(){
      gateError.style.display = '';
    });
  });
})();
